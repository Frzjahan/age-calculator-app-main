<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form>
            <div>
                <label for="day" id="lable">DAY</label>
                <input type="text" id="day" placeholder="DD" maxlength="2" autofocus>
                <div class="error-txt"></div>
            </div>
            <div>
                <label for="month" id="lable">MONTH</label>
                <input type="month" id="month" placeholder="MM" maxlength="2">
                <div class="error-txt"></div>
            </div>
            <div>
                <label for="year" id="lable">YEAR</label>
                <input type="year" id="year" placeholder="YYYY" maxlength="4">
                <div class="error-txt"></div>
            </div>
        </form>
        <div class="arrow-icon-with-line">
            <div class="line"></div>
            <button class="show-btn">></button>
        </div>
        <div class="age-container">
            <div class="years-container">
                <span class="two-spaces" id="user-years">- -</span>
                <span>years</span>
            </div>
            <div class="months-container">
                <span class="two-spaces" id="user-months">- -</span>
                <span>months</span>
            </div>
            <div class="day-container">
                <span class="two-spaces" id="user-days">- -</span>
                <span>days</span>
            </div>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
